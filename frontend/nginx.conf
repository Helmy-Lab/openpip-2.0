server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s;
    client_max_body_size 500m;

    location /api/ {
        set $backend backend;
        proxy_pass http://$backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Uploaded images the pages reference by URL. Only the two public
    # directories: dataset uploads stay behind the authenticated
    # /api/files/<id>/download endpoint.
    location ~ ^/media/(avatars|logos)/ {
        set $backend backend;
        proxy_pass http://$backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django admin, and the static files its pages load.
    location ~ ^/(django-admin|static)/ {
        set $backend backend;
        proxy_pass http://$backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /psicquic/ {
        set $backend backend;
        proxy_pass http://$backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Documentation site (MkDocs), built into the image from docs/. Public
    # address is <PUBLIC_URL>/docs/; a host proxy strips any path prefix
    # before this server.
    location /docs/ {
        alias /usr/share/nginx/docs/;
        index index.html;
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # The app is built with its base path from PUBLIC_URL, so its assets are
    # referenced under that prefix
    location / {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }


}
