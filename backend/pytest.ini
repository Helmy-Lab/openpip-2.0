[pytest]
DJANGO_SETTINGS_MODULE = openpip.settings.dev
pythonpath = .
DATABASE_URL = postgres://openpip:openpip@localhost:5432/openpip_test
# Parity tests read the live openpip database directly (see
# tests/parity/conftest.py, which no-ops django_db_setup). Database selection
# is session-global, so mixing them into the default run leaves them pointed at
# the empty test database. Run them on their own: pytest -m parity
addopts = -m "not parity"
markers =
    slow: tests that run slowly or require external network/services
    parity: integration tests comparing 2.0 against legacy openpip.usask.ca/legacy
