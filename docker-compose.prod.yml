# List-valued keys (ports, volumes) are merged with docker-compose.yml, not
# replaced, so every override below needs a !reset or !override tag. A plain
# `ports: []` once left Postgres and Redis published on every interface.
services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  frontend:
    # Reached only through the host's HTTPS proxy.
    ports: !override
      - "127.0.0.1:8080:80"

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.prod
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-openpip.usask.ca,localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://openpip.usask.ca}
    ports: !override
      - "127.0.0.1:8001:8000"
    # !override: a plain list would be merged with the dev ./backend:/app
    # bind-mount, leaving prod running from the working tree.
    volumes: !override
      - media:/app/mediafiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_initial_data &&
             exec gunicorn openpip.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  celery:
    environment:
      DJANGO_SETTINGS_MODULE: openpip.settings.prod
    # !override: a plain list would be merged with the dev ./backend:/app
    # bind-mount, leaving prod running from the working tree.
    volumes: !override
      - media:/app/mediafiles

volumes:
  media:
